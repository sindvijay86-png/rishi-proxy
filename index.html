<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1a2e">
<title>Narmada Education Companion</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Noto+Sans+Devanagari:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b1a2e;color:#e8d5a3;font-family:'Crimson Pro',Georgia,serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(201,146,42,0.3);border-radius:2px}
@keyframes riverFlow{0%{transform:translateX(-120%);opacity:0}20%{opacity:1}80%{opacity:0.5}100%{transform:translateX(120vw);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.4}50%{transform:scale(1.5);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
#app{display:flex;flex-direction:column;height:100vh;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.river{position:absolute;left:0;height:1px;width:55vw;background:linear-gradient(90deg,transparent,rgba(201,146,42,0.1),transparent);animation:riverFlow 14s linear infinite}
header{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.5rem;border-bottom:1px solid rgba(201,146,42,0.2);background:rgba(11,26,46,.97);position:relative;z-index:10;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:.9rem}
.logo{font-family:'Tiro Devanagari Hindi',serif;font-size:1.9rem;color:#c9922a;line-height:1}
.title{font-size:.95rem;font-weight:600;color:#e8d5a3}
.subtitle{font-size:.52rem;color:rgba(201,146,42,.55);letter-spacing:.8px;text-transform:uppercase;margin-top:3px}
.reset-btn{background:transparent;border:1px solid rgba(201,146,42,.4);color:#c9922a;padding:.35rem .9rem;border-radius:20px;cursor:pointer;font-family:'Noto Sans Devanagari',sans-serif;font-size:.78rem;display:none}
main{flex:1;overflow:hidden;position:relative;z-index:1;display:flex;flex-direction:column}
#welcome{flex:1;display:flex;flex-direction:column;align-items:center;padding:1.2rem 1rem;overflow-y:auto;gap:.75rem}
#chat{flex:1;overflow-y:auto;padding:1.2rem 1.5rem;display:none;flex-direction:column;gap:1rem}
.quote{font-family:'Crimson Pro',serif;font-style:italic;font-size:1.15rem;color:#c9922a;text-align:center;max-width:480px;line-height:1.5}
.pills{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;max-width:560px}
.pill{font-size:.52rem;padding:.18rem .5rem;border-radius:20px;border:1px solid rgba(201,146,42,.25);color:rgba(201,146,42,.7);font-family:'Crimson Pro',serif;background:rgba(201,146,42,.06)}
.filters{display:flex;flex-direction:column;gap:.45rem;width:100%;max-width:600px}
.filter-row{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center}
.filter-btn{background:rgba(255,255,255,.04);border:1px solid rgba(201,146,42,.2);color:rgba(232,213,163,.7);padding:.28rem .65rem;border-radius:20px;cursor:pointer;font-family:'Noto Sans Devanagari',sans-serif;font-size:.7rem;transition:all .2s}
.filter-btn.active{background:rgba(201,146,42,.2);border-color:rgba(201,146,42,.6);color:#c9922a}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;width:100%;max-width:600px}
.sugg-btn{background:rgba(255,255,255,.04);border:1px solid rgba(201,146,42,.18);color:#e8d5a3;padding:.6rem .8rem;border-radius:8px;cursor:pointer;text-align:left;font-family:'Noto Sans Devanagari',serif;font-size:.78rem;line-height:1.5;transition:background .2s;display:flex;flex-direction:column;gap:.25rem}
.sugg-btn:hover{background:rgba(201,146,42,.15)}
.sugg-subject{font-size:.52rem;color:#c9922a;text-transform:uppercase;font-family:'Crimson Pro',serif}
.sugg-class{font-size:.52rem;color:rgba(232,213,163,.4)}
.bubble{max-width:88%;animation:fadeUp .3s ease}
.user-bubble{align-self:flex-end;background:rgba(201,146,42,.1);border:1px solid rgba(201,146,42,.22);border-radius:16px 16px 4px 16px;padding:.75rem 1rem;font-family:'Noto Sans Devanagari',serif;font-size:.9rem}
.rishi-bubble{align-self:flex-start;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:4px 16px 16px 16px;padding:.75rem 1rem;max-width:92%}
.rishi-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.35rem}
.rishi-tag{font-family:'Tiro Devanagari Hindi',serif;font-size:.7rem;color:#c9922a;letter-spacing:1px}
.copy-btn{background:transparent;border:1px solid rgba(201,146,42,.3);color:rgba(201,146,42,.7);padding:.18rem .55rem;border-radius:12px;cursor:pointer;font-size:.62rem;font-family:'Noto Sans Devanagari',sans-serif;transition:all .2s}
.copy-btn.done{border-color:rgba(100,200,100,.5);color:rgba(100,200,100,.9)}
.bubble-text{font-family:'Noto Sans Devanagari',serif;font-size:.88rem;color:#e8d5a3;white-space:pre-wrap;line-height:1.8}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:#c9922a;display:inline-block;animation:pulse 1.2s ease-in-out infinite}
.thinking{font-size:.72rem;color:rgba(232,213,163,.4);font-family:'Noto Sans Devanagari',sans-serif;margin-left:.5rem}
.error-msg{align-self:center;color:#e07070;font-size:.82rem;padding:.5rem 1rem;background:rgba(220,50,50,.08);border-radius:8px;border:1px solid rgba(220,50,50,.2)}
.input-area{padding:.9rem 1.5rem;border-top:1px solid rgba(201,146,42,.15);background:rgba(11,26,46,.97);z-index:10;flex-shrink:0}
.input-row{display:flex;gap:.65rem;align-items:flex-end}
textarea{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(201,146,42,.22);border-radius:10px;padding:.7rem 1rem;color:#e8d5a3;font-family:'Noto Sans Devanagari',serif;font-size:.9rem;line-height:1.6;resize:none;outline:none}
textarea:focus{border-color:rgba(201,146,42,.5)}
.send-btn{background:#c9922a;border:none;border-radius:10px;width:46px;height:46px;font-size:1.3rem;color:#0b1a2e;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:bold}
.send-btn:disabled{opacity:.4}
.footer-hint{margin-top:.45rem;font-size:.62rem;color:rgba(201,146,42,.3);text-align:center}
@media(max-width:480px){.suggestions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <div class="bg" id="bg"></div>
  <header>
    <div class="header-left">
      <span class="logo">ऋषि</span>
      <div>
        <div class="title">Narmada Education Companion</div>
        <div class="subtitle">NCERT · MP Board · NVFC · Totto-Chan · Summerhill · Coerver · INRM</div>
      </div>
    </div>
    <button class="reset-btn" id="resetBtn" onclick="resetChat()">नया सवाल</button>
  </header>
  <main>
    <div id="welcome">
      <div class="quote">"प्रतिभा सार्वभौमिक है — अवसर नहीं।"</div>
      <div class="pills" id="pills"></div>
      <div class="filters">
        <div class="filter-row" id="classFilters"></div>
        <div class="filter-row" id="subjectFilters"></div>
      </div>
      <div class="suggestions" id="suggestions"></div>
    </div>
    <div id="chat"></div>
  </main>
  <div class="input-area">
    <div class="input-row">
      <textarea id="inputBox" rows="2" placeholder="अपना सवाल यहाँ लिखें..."></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">→</button>
    </div>
    <div class="footer-hint">Enter भेजने के लिए · Shift+Enter नई लाइन के लिए</div>
  </div>
</div>
<script>
var API_KEY = "";
var API_URL = "https://rishi-proxy.vercel.app/api/proxy";

var CONSTITUTION = "ऋषि शैक्षिक संविधान: Summerhill (स्वतंत्रता), Totto-Chan (गरिमा), HSTP होशंगाबाद (जिज्ञासा), Paulo Freire (संवाद), Mrida (उत्कृष्टता बिना अभिजात्यवाद)। हर बच्चा सक्षम है। प्रतिभा सार्वभौमिक है — अवसर नहीं। पहले अवलोकन, फिर समझाना। जिज्ञासा > निर्देश। गरिमा > आलोचना।";
var NCERT = "NCERT/MP Board: कक्षा 1-2: रिमझिम, गणित का जादू, आस-पास। कक्षा 3-5: रिमझिम, EVS, Marigold। कक्षा 6-8: वसंत, विज्ञान (भोजन/अम्ल-क्षार/फसल), सामाजिक विज्ञान, Honeysuckle। कक्षा 9-10: क्षितिज, विज्ञान (गति/रासायनिक अभिक्रिया/अनुवांशिकता), Beehive।";
var INRM = "INRM (PRADAN): मिट्टी-पानी-वनस्पति प्रबंधन। Staggered trenches, Gully plugs, मेड़बंदी, Water harvesting। गाँव का नक्शा बनाना, watershed समझना। EVS/विज्ञान में उदाहरण के रूप में उपयोग करें।";
var FOOTBALL = "Coerver Method (NVFC): Pyramid — 1.Ball Mastery (Toe taps, Sole rolls) youtube.com/watch?v=iCLRtN0N0x4 | 2.Speed youtube.com/watch?v=UXGSsVRBDJY | 3.Passing — Rondo 4v1 youtube.com/watch?v=zQdmPW018LQ | 4.1v1 Moves (Step-over, Cruyff) youtube.com/watch?v=uQjVnPebdJ0 | 5.Small Group 3v3 | 6.Finishing. Girls team: Confidence पहले, 10 min Ball Mastery से हर session शुरू।";
var SYSTEM = "आप ऋषि हैं — नर्मदा घाटी के शिक्षकों और coaches के लिए शिक्षा साथी। " + CONSTITUTION + " " + NCERT + " " + INRM + " " + FOOTBALL + " नियम: हमेशा हिंदी में जवाब दें। सरल भाषा। 200-300 शब्द। Football: Coerver level + drills + YouTube links। शिक्षा: NCERT को स्थानीय जीवन से जोड़ें।";

var PILLS = ["Mrida Philosophy","Totto-Chan","Summerhill","Paulo Freire","Hoshangabad Science","NCERT","MP Board","NVFC Football","Coerver Method","INRM · PRADAN"];
var CLASSES = ["सभी कक्षाएँ","कक्षा 1-2","कक्षा 3-5","कक्षा 6-8","कक्षा 9-10"];
var SUBJECTS = ["सभी विषय","गणित","विज्ञान","हिंदी भाषा","सामाजिक विज्ञान","अंग्रेज़ी","पर्यावरण (EVS)","INRM / प्रकृति","कला / रचनात्मकता","फुटबॉल / खेल"];
var SUGGESTIONS = [
  {s:"गणित",c:"कक्षा 3-5",t:"बाज़ार की कीमतों से भिन्न और दशमलव सिखाएं"},
  {s:"गणित",c:"कक्षा 1-2",t:"खेत और बीज गिनने से गणित की शुरुआत"},
  {s:"गणित",c:"कक्षा 6-8",t:"खेत की नापजोख से क्षेत्रफल और परिमाप सिखाएं"},
  {s:"विज्ञान",c:"कक्षा 6-8",t:"मानसून और मिट्टी से विज्ञान का पाठ बनाएं"},
  {s:"विज्ञान",c:"कक्षा 6-8",t:"नर्मदा नदी के पानी से अम्ल-क्षार का प्रयोग करें"},
  {s:"विज्ञान",c:"कक्षा 9-10",t:"नर्मदा नदी से रासायनिक अभिक्रिया का उदाहरण"},
  {s:"हिंदी भाषा",c:"कक्षा 3-5",t:"नर्मदा की कहानी से हिंदी व्याकरण सिखाएं"},
  {s:"हिंदी भाषा",c:"कक्षा 6-8",t:"स्थानीय लोककथा से वसंत के पाठ जोड़ें"},
  {s:"सामाजिक विज्ञान",c:"कक्षा 6-8",t:"आदिवासी समुदाय और इतिहास को जोड़ें"},
  {s:"सामाजिक विज्ञान",c:"कक्षा 6-8",t:"नर्मदा घाटी का भूगोल — नक्शे से"},
  {s:"अंग्रेज़ी",c:"कक्षा 6-8",t:"रोज़मर्रा की चीज़ों से अंग्रेज़ी शब्द सिखाएं"},
  {s:"पर्यावरण (EVS)",c:"कक्षा 1-2",t:"जंगल की सैर से पौधों की दुनिया समझाएं"},
  {s:"पर्यावरण (EVS)",c:"कक्षा 3-5",t:"पेड़ क्यों ज़रूरी हैं — जंगल से मिट्टी और पानी का रिश्ता"},
  {s:"INRM / प्रकृति",c:"कक्षा 3-5",t:"मिट्टी के प्रकार — खेत से मिट्टी लाकर EVS में सिखाएं"},
  {s:"INRM / प्रकृति",c:"कक्षा 6-8",t:"गाँव का watershed नक्शा बनाने की कक्षा गतिविधि"},
  {s:"INRM / प्रकृति",c:"कक्षा 6-8",t:"मेड़बंदी और गुल्ली प्लग — soil erosion का प्रयोग"},
  {s:"कला / रचनात्मकता",c:"सभी कक्षाएँ",t:"स्थानीय कला से रचनात्मक अभिव्यक्ति की गतिविधि"},
  {s:"फुटबॉल / खेल",c:"सभी कक्षाएँ",t:"Coerver pyramid — NVFC girls team के लिए कहाँ से शुरू करें?"},
  {s:"फुटबॉल / खेल",c:"सभी कक्षाएँ",t:"Ball Mastery drills और videos — beginners के लिए"},
  {s:"फुटबॉल / खेल",c:"सभी कक्षाएँ",t:"1v1 moves — step-over और inside cut कैसे सिखाएं?"},
  {s:"फुटबॉल / खेल",c:"सभी कक्षाएँ",t:"60 मिनट की complete practice session — Coerver method से"},
  {s:"सभी विषय",c:"सभी कक्षाएँ",t:"शर्मीले बच्चे को बिना दबाव के भाग लेने में कैसे मदद करें?"}
];

var messages = [], activeClass = "सभी कक्षाएँ", activeSubject = "सभी विषय", loading = false;

var bg = document.getElementById("bg");
for(var i=0;i<5;i++){var r=document.createElement("div");r.className="river";r.style.top=(10+i*18)+"%";r.style.animationDelay=(i*1.1)+"s";bg.appendChild(r);}

var pillsEl = document.getElementById("pills");
PILLS.forEach(function(p){var s=document.createElement("span");s.className="pill";s.textContent=p;pillsEl.appendChild(s);});

function buildFilters(){
  var cf=document.getElementById("classFilters");
  var sf=document.getElementById("subjectFilters");
  cf.innerHTML="";sf.innerHTML="";
  CLASSES.forEach(function(c){
    var b=document.createElement("button");b.className="filter-btn"+(c===activeClass?" active":"");
    b.textContent=c;b.onclick=function(){activeClass=c;buildFilters();buildSuggestions();};cf.appendChild(b);
  });
  SUBJECTS.forEach(function(s){
    var b=document.createElement("button");b.className="filter-btn"+(s===activeSubject?" active":"");
    b.textContent=s;b.onclick=function(){activeSubject=s;buildFilters();buildSuggestions();};sf.appendChild(b);
  });
}

function buildSuggestions(){
  var el=document.getElementById("suggestions");el.innerHTML="";
  var filtered=SUGGESTIONS.filter(function(s){
    var sm=activeSubject==="सभी विषय"||s.s===activeSubject;
    var cm=activeClass==="सभी कक्षाएँ"||s.c===activeClass||s.c==="सभी कक्षाएँ";
    return sm&&cm;
  });
  var list=filtered.length>0?filtered:SUGGESTIONS;
  list.forEach(function(s){
    var b=document.createElement("button");b.className="sugg-btn";
    b.innerHTML='<span class="sugg-subject">'+s.s+'</span><span class="sugg-class">'+s.c+'</span><span style="color:rgba(232,213,163,.82);font-size:.78rem">'+s.t+'</span>';
    b.onclick=function(){sendMessage(s.t);};el.appendChild(b);
  });
}

function showChat(){
  document.getElementById("welcome").style.display="none";
  var chat=document.getElementById("chat");
  chat.style.display="flex";
  chat.style.flexDirection="column";
  document.getElementById("resetBtn").style.display="block";
}

function resetChat(){
  messages=[];
  document.getElementById("chat").innerHTML="";
  document.getElementById("welcome").style.display="flex";
  document.getElementById("chat").style.display="none";
  document.getElementById("resetBtn").style.display="none";
}

function addBubble(role,text){
  var chat=document.getElementById("chat");
  var wrap=document.createElement("div");
  wrap.className="bubble "+(role==="user"?"user-bubble":"rishi-bubble");
  if(role==="assistant"){
    var enc=encodeURIComponent(text);
    wrap.innerHTML='<div class="rishi-header"><span class="rishi-tag">ऋषि</span><button class="copy-btn" onclick="copyText(this,\''+enc+'\')">कॉपी करें</button></div><div class="bubble-text">'+text+'</div>';
  } else {
    wrap.innerHTML='<div class="bubble-text">'+text+'</div>';
  }
  chat.appendChild(wrap);
  chat.scrollTop=chat.scrollHeight;
}

function addLoading(){
  var chat=document.getElementById("chat");
  var wrap=document.createElement("div");
  wrap.className="bubble rishi-bubble";wrap.id="loadingBubble";
  wrap.innerHTML='<div class="rishi-tag">ऋषि</div><div style="display:flex;align-items:center;margin-top:.35rem"><div class="dots"><span class="dot" style="animation-delay:0s"></span><span class="dot" style="animation-delay:.2s"></span><span class="dot" style="animation-delay:.4s"></span></div><span class="thinking">सोच रहा हूँ...</span></div>';
  chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight;
}

function removeLoading(){var el=document.getElementById("loadingBubble");if(el)el.remove();}

function copyText(btn,encoded){
  var text=decodeURIComponent(encoded);
  try{
    var el=document.createElement("textarea");el.value=text;
    el.style.cssText="position:fixed;top:0;left:0;opacity:0;pointer-events:none";
    document.body.appendChild(el);el.focus();el.select();
    document.execCommand("copy");document.body.removeChild(el);
    btn.textContent="✓ कॉपी हो गया";btn.classList.add("done");
    setTimeout(function(){btn.textContent="कॉपी करें";btn.classList.remove("done");},2000);
  }catch(e){}
}

function sendMessage(text){
  var inputBox=document.getElementById("inputBox");
  var userText=text||inputBox.value.trim();
  if(!userText||loading)return;
  inputBox.value="";loading=true;
  document.getElementById("sendBtn").disabled=true;
  showChat();
  addBubble("user",userText);
  messages.push({role:"user",content:userText});
  addLoading();

  var xhr=new XMLHttpRequest();
  xhr.open("POST",API_URL,true);
  xhr.setRequestHeader("Content-Type","application/json");
  
  xhr.setRequestHeader("anthropic-version","2023-06-01");
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4){
      removeLoading();
      loading=false;
      document.getElementById("sendBtn").disabled=false;
      if(xhr.status===200){
        try{
          var data=JSON.parse(xhr.responseText);
          var reply=data.content&&data.content[0]?data.content[0].text:"कोई जवाब नहीं मिला।";
          messages.push({role:"assistant",content:reply});
          addBubble("assistant",reply);
        }catch(e){showError();}
      } else {
        showError();
      }
    }
  };
  xhr.onerror=function(){removeLoading();loading=false;document.getElementById("sendBtn").disabled=false;showError();};
  xhr.send(JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:600,system:SYSTEM,messages:messages}));
}

function showError(){
  var chat=document.getElementById("chat");
  var e=document.createElement("div");e.className="error-msg";
  e.textContent="कुछ गड़बड़ हुई। कृपया दोबारा कोशिश करें।";
  chat.appendChild(e);chat.scrollTop=chat.scrollHeight;
}

document.getElementById("inputBox").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});

buildFilters();buildSuggestions();
